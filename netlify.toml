[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  SITE_URL = "https://ristorante-colosseo-winsen.netlify.app"

[[redirects]]
  from = "/"
  to = "/de"
  status = 302

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/admin*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"
